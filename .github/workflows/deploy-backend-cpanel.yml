name: Deploy insurance backend to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: Build TypeScript project
        run: npm run build

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Add cPanel Passenger restart marker
        run: mkdir -p tmp && date > tmp/restart.txt

      - name: Deploy backend to cPanel over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ${{ secrets.CPANEL_FTP_PROTOCOL || 'ftp' }}
          port: ${{ secrets.CPANEL_FTP_PORT || 21 }}
          local-dir: ./
          server-dir: ${{ secrets.CPANEL_BACKEND_DIR }}
          exclude: |
            **/.git*
            **/.github/**
            **/.env
            **/src/**
            **/coverage/**
            **/npm-debug.log*
            **/*.ts
            **/tsconfig.json
            **/node_modules/**
